<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Host</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Private Lua Host</h1>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </header>

    <section class="upload-section">
      <h2>Upload / Update Script</h2>
      <div class="form-row">
        <input type="text" id="scriptName" placeholder="script-name (a-z, 0-9, -, _)" maxlength="64">
      </div>
      <textarea id="scriptContent" placeholder="-- paste your Lua script here" rows="12"></textarea>
      <div class="form-actions">
        <button id="saveBtn" class="btn-primary">Save Script</button>
        <button id="clearBtn" class="btn-secondary">Clear</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="list-section">
      <h2>Your Scripts</h2>
      <div id="scriptList" class="script-list">
        <p class="empty">No scripts yet. Upload one above.</p>
      </div>
    </section>
  </div>

  <!-- Modal for viewing / editing -->
  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Script</h3>
        <button id="closeModal" class="btn-secondary">Close</button>
      </div>
      <textarea id="modalContent" rows="18"></textarea>
      <div class="modal-actions">
        <button id="copyRawBtn" class="btn-primary">Copy Raw URL</button>
        <button id="updateFromModalBtn" class="btn-primary">Update</button>
        <button id="deleteBtn" class="btn-danger">Delete</button>
      </div>
      <p id="modalStatus" class="status"></p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
